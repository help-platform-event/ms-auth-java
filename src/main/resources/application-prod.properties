# Production profile (set by the Docker image). Every value comes from the environment with an
# EMPTY default, never a dev value. Empty (not a bare `${VAR}`) on purpose: @ConfigurationProperties
# binding silently keeps an unresolvable `${VAR}` as the literal string, whereas an empty value makes
# startup fail with a clear message (@NotBlank on app.auth.jwt.secret, Hikari's "jdbcUrl is
# required", Google's ClientRegistration assertion, Kafka's bootstrap check, app.seed.admin.required).

app.auth.jwt.secret=${JWT_SECRET:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}

# The admin seed is mandatory in prod: a wiped database must never come up without an admin.
app.seed.admin.email=${ADMIN_EMAIL:}
app.seed.admin.password=${ADMIN_PASSWORD:}
app.seed.admin.required=true
