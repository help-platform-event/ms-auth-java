spring.application.name=ms-auth

# --- Datasource (dev) ---
# spring-boot-docker-compose also derives these from compose.yaml when Docker is running;
# the values below are the fallback for running against a manually-started MySQL.
spring.datasource.url=jdbc:mysql://localhost:3307/ms_auth
spring.datasource.username=ms_auth
spring.datasource.password=ms_auth

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true

# --- Auth / JWT ---
# Dev-only throwaway secret (Base64, 32+ bytes for HS256) - override via env var beyond this machine.
app.auth.jwt.secret=${JWT_SECRET:c2FtcGxlLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtMzJieXRlcyE=}
app.auth.jwt.access-token-ttl=15m
app.auth.refresh-token.ttl=30d
app.auth.google.redirect-uri=postmessage

# --- Google OAuth2 client ---
# Non-blank placeholders are required even without testing Google sign-in: an empty client-id/secret
# crashes the whole app at boot (ClientRegistration.Builder asserts non-blank), not just this endpoint.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-placeholder-client-secret}

# --- RFC 9457 ProblemDetail responses for @Valid failures etc. (default is false in Boot 4.1) ---
spring.mvc.problemdetails.enabled=true

# --- Kafka ---
# spring-boot-docker-compose also derives this from compose.yaml when Docker is running; the
# value below is the fallback for running against a manually-started broker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Don't leak this service's Java class names into the payload - consumers don't share our classpath.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Admin seed ---
# Creates an ADMIN at startup if none exists. Disabled when both are blank (dev default);
# mandatory under the prod profile (see application-prod.properties).
app.seed.admin.email=${ADMIN_EMAIL:}
app.seed.admin.password=${ADMIN_PASSWORD:}

# --- Actuator ---
# Only health is exposed (liveness/readiness probes for Docker and GCP), unauthenticated, no details.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
