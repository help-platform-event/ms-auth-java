spring.application.name=ms-auth

# --- Datasource (dev) ---
# spring-boot-docker-compose also derives these from compose.yaml when Docker is running;
# the values below are the fallback for running against a manually-started MySQL.
spring.datasource.url=jdbc:mysql://localhost:3307/ms_auth
spring.datasource.username=ms_auth
spring.datasource.password=ms_auth

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
