services:
  mysql:
    image: 'mysql:8.4'
    environment:
      MYSQL_DATABASE: 'ms_auth'
      MYSQL_USER: 'ms_auth'
      MYSQL_PASSWORD: 'ms_auth'
      MYSQL_ROOT_PASSWORD: 'root'
    # Host port 3307 (not 3306) to avoid clashing with any MySQL already on 3306.
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: 'apache/kafka:3.9.0'
    # Single-node KRaft mode: no separate Zookeeper. Host port 9094 (not 9092) to avoid clashing
    # with any Kafka already running locally, same reasoning as MySQL's 3307 above.
    ports:
      - '9094:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # PLAINTEXT is for the host (spring-boot:run, via localhost:9094); INTERNAL is for other
      # containers on the compose network (the `app` service), which can't reach "localhost:9094".
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9094,INTERNAL://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: 'adminer:4'
    # Host port 8081 (Adminer listens on 8080 internally) - dev-only, no specific clash to dodge.
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # The app itself, from the Dockerfile. Behind the `app` profile so spring-boot:run (whose
  # docker-compose integration activates no profile) never starts it; run the whole containerised
  # stack with `docker compose --profile app up --build`. All values below are dev-only.
  app:
    build: .
    profiles: ['app']
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/ms_auth'
      SPRING_DATASOURCE_USERNAME: 'ms_auth'
      SPRING_DATASOURCE_PASSWORD: 'ms_auth'
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      JWT_SECRET: 'c2FtcGxlLWRldi1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtMzJieXRlcyE='
      # Real values come from the gitignored .env next to this file (see .env.example).
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-dev-placeholder-client-id}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET:-dev-placeholder-client-secret}'
      ADMIN_EMAIL: 'admin@example.com'
      ADMIN_PASSWORD: 'Admin123!!'
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
